name = "youtube-telegram-bot"
main = "worker/src/index.js"
compatibility_date = "2024-12-01"

# File ini SENGAJA di root repo: Cloudflare Workers Builds menjalankan
# `npx wrangler deploy` dari root, jadi wrangler.toml harus ditemukan di sini.
# Kalau file ini hanya ada di subfolder, deploy gagal dengan error
# "Could not detect a directory containing static files".
#
# Repo tujuan: github.com/43VfQLAv0MTy/yt-downloader
# Secrets TIDAK ditulis di sini — set lewat Dashboard / `wrangler secret put`:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, GITHUB_TOKEN
[vars]
GITHUB_OWNER = "43VfQLAv0MTy"
GITHUB_REPO = "yt-downloader"
GITHUB_REF = "main"
ALLOWED_USER_IDS = ""
# YT_PROXY = proxy DEFAULT yt-dlp (--proxy), dipakai bila user hanya
# kirim <link> (tanpa perintah proxy custom). Isi apa pun boleh:
# tanpa user:pass ("socks5:203.0.113.10:1080", "203.0.113.10:8080")
# maupun dengan user:pass ("socks5://user:pass@203.0.113.10:1080").
# Kosong = tanpa proxy. Kalau terisi, itulah default-nya.
# PERINGATAN: repo ini publik, jadi user:pass yang ditulis di sini
# akan terlihat siapa pun di GitHub. Kalau tidak mau bocor, kosongkan
# ini dan isi GitHub secret YT_PROXY saja — itu juga default, sama saja.
YT_PROXY = ""
